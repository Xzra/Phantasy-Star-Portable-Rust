name: Windows preview build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Bundle the MSVC runtime into the binaries for a standalone preview.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test workspace on Windows
        run: cargo test --workspace --all-features --locked --target x86_64-pc-windows-msvc
      - name: Build Windows executables
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --features viewer --bin model-viewer --bin psp-client --bin phantasy-star --bin engine-editor --bin unreal-export
      - name: Validate Dagan setup and native import
        shell: pwsh
        env:
          PSP_PREPARE_ONLY: '1'
        run: |
          cmd /c tools\Load-Dagan.cmd
          if ($LASTEXITCODE -ne 0) { throw "Dagan setup helper failed" }
          & target/x86_64-pc-windows-msvc/release/psp-client.exe inspect tools/local/dagan.ice
          if ($LASTEXITCODE -ne 0) { throw "Dagan model import failed" }
          & target/x86_64-pc-windows-msvc/release/psp-client.exe motion-list tools/local/dagan.ice tools/local/dagan-motion.ice
          if ($LASTEXITCODE -ne 0) { throw "Dagan skeletal motion validation failed" }
          cmd /c tools\Play-Dagan.cmd
          if ($LASTEXITCODE -ne 0) { throw "Dagan game setup helper failed" }
      - name: Export and independently validate UE 5.7.4 migration kit
        shell: pwsh
        run: |
          & target/x86_64-pc-windows-msvc/release/unreal-export.exe --project projects/starter/project.json --output unreal-staging
          if ($LASTEXITCODE -ne 0) { throw "Unreal export failed" }
          npm install --prefix local/unreal-validator --ignore-scripts --no-audit --no-fund gltf-validator@2.0.0-dev.3.10
          if ($LASTEXITCODE -ne 0) { throw "Validator install failed" }
          node tools/validate-unreal-glb.cjs local/unreal-validator/node_modules/gltf-validator unreal-staging
          if ($LASTEXITCODE -ne 0) { throw "GLB validation failed" }
      - name: Package preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging, dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/model-viewer.exe staging/model-viewer.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/psp-client.exe staging/psp-client.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/phantasy-star.exe staging/phantasy-star.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/engine-editor.exe staging/engine-editor.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/unreal-export.exe staging/unreal-export.exe
          Copy-Item assets staging/assets -Recurse
          Copy-Item projects staging/projects -Recurse
          Copy-Item docs staging/docs -Recurse
          Copy-Item START-HERE.md staging/START-HERE.md
          Copy-Item START-HERE.html staging/START-HERE.html
          Copy-Item tools/Start-Editor.cmd staging/Start-Editor.cmd
          Copy-Item tools/Play-Project.cmd staging/Play-Project.cmd
          Copy-Item docs/windows-preview.txt staging/README.txt
          Copy-Item tools/Load-Dagan.cmd staging/Load-Dagan.cmd
          Copy-Item tools/Play-Dagan.cmd staging/Play-Dagan.cmd
          Copy-Item THIRD_PARTY_NOTICES.md staging/THIRD_PARTY_NOTICES.md
          Copy-Item THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          Copy-Item target/x86_64-pc-windows-msvc/release/model-viewer.exe dist/model-viewer.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/phantasy-star.exe dist/phantasy-star.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/engine-editor.exe dist/engine-editor.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/unreal-export.exe dist/unreal-export.exe
          Compress-Archive -Path unreal-staging/* -DestinationPath dist/phantasy-star-unreal-5.7.4.zip
          Compress-Archive -Path staging/* -DestinationPath dist/phantasy-star-rust-windows-x64.zip
          git archive --format=zip --output=dist/phantasy-star-rust-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw "Source archive failed" }
          Expand-Archive -Path dist/phantasy-star-rust-source.zip -DestinationPath staging/source
          Copy-Item tools/Build-Engine.cmd staging/source/Build-Engine.cmd
          Compress-Archive -Path staging/* -DestinationPath dist/phantasy-star-engine-windows-x64.zip
          $checksums = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content dist/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error
