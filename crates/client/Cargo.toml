[package]
name = "psp-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
psp-core.workspace = true
psp-assets.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
macroquad = { version = "0.4.16", default-features = false, optional = true }
image = { version = "0.24.9", default-features = false, features = ["png", "dds"], optional = true }

[features]
default = []
viewer = ["dep:macroquad", "dep:image"]

[[bin]]
name = "model-viewer"
path = "src/viewer.rs"
required-features = ["viewer"]

[[bin]]
name = "phantasy-star"
path = "src/game.rs"
required-features = ["viewer"]

[[bin]]
name = "engine-editor"
path = "src/editor.rs"
required-features = ["viewer"]

[[bin]]
name = "unreal-export"
path = "src/unreal_export_cli.rs"
required-features = ["viewer"]
