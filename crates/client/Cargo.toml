[package]
name = "psp-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
psp-core.workspace = true
psp-assets.workspace = true
macroquad = { version = "0.4.16", default-features = false, optional = true }
image = { version = "0.24.9", default-features = false, features = ["png"], optional = true }

[features]
default = []
viewer = ["dep:macroquad", "dep:image"]

[[bin]]
name = "model-viewer"
path = "src/viewer.rs"
required-features = ["viewer"]
